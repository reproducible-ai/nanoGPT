name: nanogpt-shakespeare-char reproduction

# Generated by scaffold_row.py, then adapted. Clean-DAG rules baked in: every step is
# a NAMED `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag.
#
# Three deliberate departures from the scaffold's output:
#
#  1. The roar wheel comes from its PUBLISHED file URL, verified by sha256, instead of
#     the ROAR_WHEEL_URL compute-target secret. That secret is shared per-target, so
#     two agents on different builds overwrite each other's value and corrupt both
#     runs. An immutable public URL has no such failure mode, so the secret is dropped
#     from `secrets:` entirely.
#
#  2. TRACKIO_SPACE_ID is set INSIDE the recorded argv (`-- env VAR=... python ...`),
#     not exported around `roar run`. roar records argv only; it re-emits
#     `--wandb-to-trackio` on reproduce but never re-emits TRACKIO_SPACE_ID. An
#     exported variable therefore yields a green capture whose rebuild silently takes
#     the shim's no-op branch. `env` is exec, not a shell, so the traced process tree
#     is unchanged and the variable travels with the record.
#
#  3. `prepare` does NOT arm --wandb-to-trackio. prepare.py contains no tracking code
#     at all, so the flag there only pulls the bridge's own dependency closure into
#     that step's recorded package list. The freeze should describe the workload.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info

    # --- roar, from the published artefact ------------------------------------
    WHEEL=roar_cli-0.4.4rc5-cp310-abi3-manylinux_2_34_x86_64.whl
    curl -sSL -o /tmp/roar_wheel/$WHEEL --create-dirs \
      https://test-files.pythonhosted.org/packages/f0/e2/210129d82c059236902d4e3715cf7398925e72c2f646afc6e41a1a8b6bd1/$WHEEL
    echo "ed35ed6bda3b5698ab65a887e7390c2ac073123f6d94bfa27b8282285352219c  /tmp/roar_wheel/$WHEEL" | sha256sum -c -

    # Three stale roar installs and four entrypoints ship on this AMI family.
    # Deleting only the .dist-info leaves an importable package behind.
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    echo "--- stale-install verification sweep (must print nothing) ---"
    find /usr/local/lib /opt/pytorch/lib -maxdepth 4 \
         \( -name 'roar_inject.pth' -o -name 'roar_cli-*.dist-info' \) -print

    # roar must run under the *recorded* interpreter, or it prepends its own
    # interpreter's site-packages onto the traced child and host packages shadow
    # recorded pins. /opt/pytorch/bin/python IS the interpreter the workload uses.
    # (scaffold_row.py emits `uv tool install`; this AMI ships no `uv`, so the same
    # isolated install is done with a venv built from that interpreter.)
    echo "--- interpreter diag ---"; command -v uv || echo "no uv on PATH"; /opt/pytorch/bin/python -VV
    sudo rm -rf /opt/roar-0.4.4rc5
    sudo /opt/pytorch/bin/python -m venv /opt/roar-0.4.4rc5
    sudo /opt/roar-0.4.4rc5/bin/pip install --quiet --disable-pip-version-check /tmp/roar_wheel/$WHEEL
    # `roar put hf://...` needs huggingface_hub. Assert it up front rather than
    # discovering it after the training stage, which is the most expensive possible
    # place to fail.
    /opt/roar-0.4.4rc5/bin/python -c "import huggingface_hub as h; print('huggingface_hub', h.__version__)"
    sudo ln -sf /opt/roar-0.4.4rc5/bin/roar /usr/local/bin/roar
    sudo ln -sf /opt/roar-0.4.4rc5/bin/roar-worker /usr/local/bin/roar-worker
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc5" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls /opt/roar-0.4.4rc5/lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    roar --version

    # The wandb->trackio shim runs `import trackio` in the WORKLOAD interpreter, not
    # in roar's. Without it the shim falls back to its silent no-op stub: the run
    # exits 0, every gate stays green, and no metric is ever logged. Assert, do not
    # assume.
    /opt/pytorch/bin/python -c "import trackio; print('trackio', trackio.__version__)"

    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

prepare:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar run -n prepare-shakespeare-char-data -- python data/shakespeare_char/prepare.py
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar run -n train-shakespeare-char-gpt --wandb-to-trackio -- env TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1 python train.py config/train_shakespeare_char.py --compile=False --wandb_log=True --wandb_project=nanogpt-shakespeare-char --wandb_run_name=shakespeare-char-full-5000
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact out-shakespeare-char/ckpt.pt model.name=nanogpt-shakespeare-char model.version=1 license.id=MIT license.name='MIT License' description='nanoGPT character-level Shakespeare: a 6-layer, 6-head, 384-dim GPT (~10.7M params) trained from scratch on the tiny-Shakespeare corpus' documentation.url=https://github.com/reproducible-ai/nanoGPT/blob/master/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put out-shakespeare-char/ckpt.pt hf://reproducible-ai/nanogpt --public --yes --no-tag -m "nanoGPT shakespeare_char: 6-layer char-level GPT (~10.7M params), full 5000-iter recipe on tiny-Shakespeare"
  trace: off
