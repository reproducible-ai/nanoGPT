name: nanogpt-shakespeare-char reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    roar --version
    roar tracer use preload   # D16: pinned; NEVER ptrace
    roar tracer
    roar init || true
  trace: off

prepare:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n prepare --wandb-to-trackio -- python data/shakespeare_char/prepare.py
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- python train.py config/train_shakespeare_char.py --device=cuda --compile=False --wandb_log=True --wandb_project=nanogpt-shakespeare-char --max_iters=5000 --always_save_checkpoint=True
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact out-shakespeare-char/ckpt.pt model.name=nanogpt-shakespeare-char model.version=1 license.id=MIT license.name='MIT License' description='nanoGPT shakespeare_char — character-level GPT reproduction (converged, 5000 iters)' documentation.url=https://github.com/reproducible-ai/nanoGPT/blob/master/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put out-shakespeare-char/ckpt.pt hf://reproducible-ai/nanogpt --public --yes --no-tag -m "nanoGPT shakespeare_char — converged reproduction, 5000 iters, playbook v1.0"
  trace: off
