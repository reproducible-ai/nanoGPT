name: nanoGPT shakespeare_char — roar 0.4.3 stack validation (truncated)

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    roar --version
    roar init || true
  trace: off

prepare:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n prepare --wandb-to-trackio -- python data/shakespeare_char/prepare.py
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- python train.py config/train_shakespeare_char.py --device=cuda --compile=False --wandb_log=True --wandb_project=nanogpt-validate043 --max_iters=50 --eval_interval=25 --eval_iters=20 --always_save_checkpoint=True
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact out-shakespeare-char/ckpt.pt model.name=nanogpt model.version=1 license.id=MIT license.name='MIT License' description='nanoGPT shakespeare_char — roar 0.4.3 stack validation row (truncated, 50 iters)' documentation.url=https://github.com/reproducible-ai/nanoGPT/blob/master/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put out-shakespeare-char/ckpt.pt hf://reproducible-ai/nanogpt/validate043 --public --yes --no-tag -m "nanoGPT shakespeare_char — roar 0.4.3 stack validation (TRUNCATED, 50 iters; not converged)"
  trace: off
